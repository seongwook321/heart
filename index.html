<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카페인과 내 심장: 심박동 시뮬레이션</title>
    <!-- Tailwind CSS (디자인 프레임워크) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js (그래프 라이브러리) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 심장 애니메이션 CSS */
        .heart {
            width: 100px;
            height: 100px;
            background-color: #ef4444;
            position: relative;
            transform: rotate(-45deg);
            margin: 40px auto;
            animation: beat 1s infinite;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        .heart::before, .heart::after {
            content: "";
            width: 100px;
            height: 100px;
            background-color: #ef4444;
            border-radius: 50%;
            position: absolute;
        }
        .heart::before { top: -50px; left: 0; }
        .heart::after { top: 0; left: 50px; }

        /* 심박 애니메이션 속도 제어 클래스 */
        .beat-normal { animation: beat 1s infinite; }
        .beat-fast { animation: beat 0.3s infinite; box-shadow: 0 0 40px rgba(239, 68, 68, 0.9); }
        .beat-slow { animation: beat 1.5s infinite; box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }

        @keyframes beat {
            0% { transform: rotate(-45deg) scale(1); }
            15% { transform: rotate(-45deg) scale(1.2); }
            30% { transform: rotate(-45deg) scale(1); }
            45% { transform: rotate(-45deg) scale(1.2); }
            60% { transform: rotate(-45deg) scale(1); }
        }

        /* 탭 숨김 처리용 */
        .hidden-tab { display: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto pt-10 pb-20 px-4">
        <h1 class="text-3xl font-bold text-center text-blue-800 mb-8">🩺 카페인과 내 심장 시뮬레이션</h1>

        <!-- 탭 네비게이션 -->
        <div class="flex justify-center mb-6 border-b-2 border-gray-300">
            <button id="tab-sim-btn" class="px-6 py-2 text-lg font-bold text-blue-600 border-b-4 border-blue-600 focus:outline-none" onclick="switchTab('sim')">
                1. 시뮬레이션
            </button>
            <button id="tab-report-btn" class="px-6 py-2 text-lg font-bold text-gray-500 hover:text-blue-500 focus:outline-none" onclick="switchTab('report')">
                2. 활동 보고서
            </button>
        </div>

        <!-- ================= [페이지 1] 시뮬레이션 영역 ================= -->
        <div id="tab-sim" class="bg-white rounded-xl shadow-lg p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <!-- 설정 패널 -->
                <div class="bg-blue-50 p-6 rounded-lg">
                    <h2 class="text-xl font-bold mb-4 text-blue-700">⚙️ 나의 상태 설정하기</h2>
                    
                    <label class="block mb-2 font-semibold">1. 마실 음료 선택</label>
                    <select id="drinkSelect" class="w-full p-2 mb-6 border rounded-md">
                        <option value="monster">몬스터 에너지 (초고카페인)</option>
                        <option value="mega">대용량 프랜차이즈 커피 (고카페인 누적)</option>
                        <option value="hot6">핫식스 더 킹 (표준 에너지 드링크)</option>
                    </select>

                    <label class="block mb-2 font-semibold">2. 나의 카페인 민감도 (체질)</label>
                    <select id="sensitivitySelect" class="w-full p-2 mb-6 border rounded-md">
                        <option value="normal">보통 (일반적인 학생)</option>
                        <option value="sensitive">민감함 (카페인 찌질이 😭)</option>
                        <option value="insensitive">둔감함 (강철 심장 🛡️)</option>
                    </select>

                    <button onclick="runSimulation()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-md hover:bg-blue-700 transition">
                        시뮬레이션 시작!
                    </button>
                </div>

                <!-- 시각화 패널 -->
                <div class="flex flex-col items-center justify-center p-6 border-2 border-dashed border-gray-300 rounded-lg">
                    <h2 class="text-lg font-bold mb-2">❤️ 실시간 심장 상태</h2>
                    <!-- 심장 일러스트 애니메이션 -->
                    <div id="heartContainer" class="heart beat-normal"></div>
                    <p id="heartStatus" class="mt-8 text-center font-semibold text-gray-700">현재 평온한 상태입니다. (80 bpm)</p>
                </div>
            </div>

            <!-- 그래프 영역 -->
            <div class="mt-8">
                <h2 class="text-xl font-bold mb-4 text-center">📈 시간에 따른 심박동(bpm) 변화 그래프</h2>
                <canvas id="heartRateChart" width="400" height="150"></canvas>
            </div>
        </div>

        <!-- ================= [페이지 2] 활동 보고서 영역 ================= -->
        <div id="tab-report" class="bg-white rounded-xl shadow-lg p-6 hidden-tab">
            <h2 class="text-2xl font-bold mb-6 text-center text-green-700">📝 탐구 활동 보고서 제출</h2>
            
            <form id="reportForm">
                <!-- 인적사항 -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-gray-50 p-4 rounded-lg border">
                    <div>
                        <label class="block font-semibold mb-2">학년</label>
                        <div class="flex space-x-2">
                            <label><input type="radio" name="grade" value="1학년" required> 1학년</label>
                            <label><input type="radio" name="grade" value="2학년"> 2학년</label>
                            <label><input type="radio" name="grade" value="3학년"> 3학년</label>
                        </div>
                    </div>
                    <div>
                        <label class="block font-semibold mb-2">반</label>
                        <select id="classNum" name="classNum" class="w-full p-2 border rounded" required>
                            <option value="">선택</option>
                            <!-- 1반부터 11반까지 생성 -->
                            <script>
                                for(let i=1; i<=11; i++) document.write(`<option value="${i}반">${i}반</option>`);
                            </script>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold mb-2">번호</label>
                        <select id="studentNum" name="studentNum" class="w-full p-2 border rounded" required>
                            <option value="">선택</option>
                            <!-- 1번부터 25번까지 생성 -->
                            <script>
                                for(let i=1; i<=25; i++) document.write(`<option value="${i}번">${i}번</option>`);
                            </script>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold mb-2">이름</label>
                        <input type="text" id="studentName" name="studentName" class="w-full p-2 border rounded" placeholder="홍길동" required>
                    </div>
                </div>

                <!-- 객관식 문제 -->
                <div class="mb-6">
                    <label class="block font-bold text-lg mb-2 text-gray-800">Q1. 고카페인 음료 섭취 시, 카페인에 '민감한' 사람의 심박동 변화 특징으로 가장 적절한 것은? (5점)</label>
                    <div class="space-y-2 pl-4">
                        <label class="block"><input type="radio" name="mcScore" value="0"> ① 섭취 즉시 심박수가 감소하여 수면을 유도한다.</label>
                        <label class="block"><input type="radio" name="mcScore" value="0"> ② 심박동 그래프가 변화 없이 일직선으로 유지된다.</label>
                        <label class="block"><input type="radio" name="mcScore" value="5" required> ③ 심박수가 급격히 증가하며 그래프의 파동이 뾰족하고 불규칙해진다.</label>
                        <label class="block"><input type="radio" name="mcScore" value="0"> ④ 서서히 심박수가 증가하다가 10분 만에 원래대로 돌아온다.</label>
                    </div>
                </div>

                <!-- 서술형 문항 -->
                <div class="mb-6">
                    <label class="block font-bold text-lg mb-2 text-gray-800">Q2. 시뮬레이션 결과를 바탕으로, 카페인이 심장과 자율신경계에 미치는 영향을 작성하고, 건강한 학업(시험기간)을 위한 자신의 다짐을 적어보세요.</label>
                    <textarea id="essayText" name="essayText" rows="5" class="w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="자신의 체질(민감도)과 연관 지어 구체적으로 작성해주세요." required></textarea>
                </div>

                <!-- 제출 버튼 -->
                <button type="submit" id="submitBtn" class="w-full bg-green-600 text-white font-bold py-3 rounded-md hover:bg-green-700 transition text-lg">
                    과제 제출하기
                </button>
            </form>
        </div>
    </div>

    <!-- 기능 구현 자바스크립트 -->
    <script>
        // 1. 탭 전환 기능
        function switchTab(tabName) {
            const simTab = document.getElementById('tab-sim');
            const reportTab = document.getElementById('tab-report');
            const simBtn = document.getElementById('tab-sim-btn');
            const reportBtn = document.getElementById('tab-report-btn');

            if (tabName === 'sim') {
                simTab.classList.remove('hidden-tab');
                reportTab.classList.add('hidden-tab');
                simBtn.className = "px-6 py-2 text-lg font-bold text-blue-600 border-b-4 border-blue-600 focus:outline-none";
                reportBtn.className = "px-6 py-2 text-lg font-bold text-gray-500 hover:text-blue-500 focus:outline-none";
            } else {
                simTab.classList.add('hidden-tab');
                reportTab.classList.remove('hidden-tab');
                reportBtn.className = "px-6 py-2 text-lg font-bold text-green-600 border-b-4 border-green-600 focus:outline-none";
                simBtn.className = "px-6 py-2 text-lg font-bold text-gray-500 hover:text-blue-500 focus:outline-none";
            }
        }

        // 2. Chart.js 그래프 초기화
        const ctx = document.getElementById('heartRateChart').getContext('2d');
        let heartChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['0분(섭취)', '10분', '30분', '1시간', '2시간', '3시간'],
                datasets: [{
                    label: '분당 심박수 (bpm)',
                    data: [80, 80, 80, 80, 80, 80],
                    borderColor: 'rgb(59, 130, 246)',
                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                    borderWidth: 3,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                scales: { y: { min: 60, max: 160 } }
            }
        });

        // 3. 시뮬레이션 실행 로직
        function runSimulation() {
            const drink = document.getElementById('drinkSelect').value;
            const sensitivity = document.getElementById('sensitivitySelect').value;
            
            const heart = document.getElementById('heartContainer');
            const statusText = document.getElementById('heartStatus');
            
            let newData = [];
            let newColor = '';

            // 클래스 초기화
            heart.classList.remove('beat-normal', 'beat-fast', 'beat-slow');

            if (sensitivity === 'normal') {
                newData = [80, 85, 95, 90, 85, 80];
                newColor = 'rgb(59, 130, 246)'; // Blue
                heart.classList.add('beat-normal');
                statusText.innerHTML = "적당한 각성 상태입니다. (최고 95 bpm)<br>집중력이 일시적으로 상승합니다.";
            } else if (sensitivity === 'sensitive') {
                newData = [80, 110, 135, 120, 100, 90];
                newColor = 'rgb(239, 68, 68)'; // Red
                heart.classList.add('beat-fast');
                statusText.innerHTML = "⚠️ 과부하 상태입니다! (최고 135 bpm)<br>불안, 손떨림, 수면 장애가 발생할 수 있습니다.";
            } else if (sensitivity === 'insensitive') {
                newData = [80, 82, 85, 83, 81, 80];
                newColor = 'rgb(34, 197, 94)'; // Green
                heart.classList.add('beat-slow');
                statusText.innerHTML = "변화가 미미합니다. (최고 85 bpm)<br>지속적인 섭취 시 카페인 중독 위험이 있습니다.";
            }

            // 그래프 업데이트
            heartChart.data.datasets[0].data = newData;
            heartChart.data.datasets[0].borderColor = newColor;
            heartChart.data.datasets[0].backgroundColor = newColor.replace('rgb', 'rgba').replace(')', ', 0.2)');
            heartChart.update();
        }

        // 4. 구글 시트로 데이터 전송 (선생님의 URL 적용됨)
        document.getElementById('reportForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 기본 폼 제출 동작(새로고침) 방지
            
            // 선생님께서 부여해주신 최종 Apps Script URL
            const scriptURL = 'https://script.google.com/macros/s/AKfycbwdLPe24o_XGKIelk_w6J7kUDk1D_-P2lnJjl4mEO9jsawBsq5lshorsxKU_VXTqKjQNQ/exec';
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "데이터 전송 중... ⏳";
            submitBtn.disabled = true;
            submitBtn.classList.replace('bg-green-600', 'bg-gray-400');

            // 폼 데이터를 FormData 객체로 생성
            const formData = new FormData(document.getElementById('reportForm'));

            // Fetch API를 활용한 비동기 POST 전송
            fetch(scriptURL, { 
                method: 'POST', 
                body: formData 
            })
            .then(response => response.json())
            .then(data => {
                if(data.result === 'success') {
                    alert("🎉 보고서가 성공적으로 제출되었습니다! 수고하셨습니다.");
                    document.getElementById('reportForm').reset(); // 폼 비우기
                    switchTab('sim'); // 제출 후 시뮬레이션 화면으로 복귀
                } else {
                    alert("오류 발생: " + data.error);
                }
            })
            .catch(error => {
                // CORS 경고가 뜰 수 있으나 데이터가 시트에 들어갔다면 성공 처리하는 우회 로직
                console.error('Error!', error.message);
                alert("전송이 완료되었거나 네트워크 문제가 발생했습니다. 선생님의 스프레드시트를 확인해 주세요.");
            })
            .finally(() => {
                // 버튼 상태 복구
                submitBtn.innerText = "과제 제출하기";
                submitBtn.disabled = false;
                submitBtn.classList.replace('bg-gray-400', 'bg-green-600');
            });
        });
    </script>
</body>
</html>
